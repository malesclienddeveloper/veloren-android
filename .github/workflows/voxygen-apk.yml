# Build APK debug Voxygen asli: port Android dari fork ejir/veloren (commit dipatok)
# + patch di android-patches/ + master TERBARU dari Veloren resmi.
# "Re-run all jobs" pada run terakhir sudah cukup untuk mengambil update baru.
name: Build Voxygen APK

on:
  push:
    branches: [android-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      ANDROID_USER_HOME: ${{ github.workspace }}/.android-home
    steps:
      # Dua checkout di folder terpisah, supaya .cargo/config.toml repo ini
      # tidak ikut memengaruhi build di src/.
      - name: Checkout patch
        uses: actions/checkout@v4
        with:
          path: kit
          persist-credentials: false

      - name: Checkout port Android (fork)
        uses: actions/checkout@v4
        with:
          repository: ejir/veloren
          ref: f7f1684ddf9b44928af810964f11321692c8cf7b
          path: src
          # Riwayat penuh agar commit dasar port tersedia. Jangan pakai partial
          # clone (filter): git-lfs gagal memindai file di clone seperti itu.
          fetch-depth: 0
          persist-credentials: false

      - name: Pasang port Android di atas Veloren resmi terbaru
        working-directory: src
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
          # Commit upstream yang menjadi dasar fork.
          PORT_BASE: 648ec121ee78815d8c5288ec1ec648893ef20cdd
        run: |
          git config user.name "android-build"
          git config user.email "android-build@users.noreply.github.com"
          git apply --index --verbose ../kit/android-patches/*.patch
          git commit -qm "android patches"
          port="$(git rev-parse HEAD)"
          git diff --binary --full-index "$PORT_BASE" "$port" > "$RUNNER_TEMP/port.diff"

          # Hash commit di GitLab berbeda dari fork di GitHub, jadi tidak bisa
          # di-merge. Selisih port diterapkan dengan 3-way di atas master resmi.
          # HEAD tetap commit resmi, sehingga versi yang dilaporkan ke server asli.
          git remote add upstream https://gitlab.com/veloren/veloren.git
          git fetch upstream master
          git checkout -q --detach upstream/master
          # Gagal di sini berarti ada konflik antara update resmi dan port Android.
          git apply --3way --index "$RUNNER_TEMP/port.diff"

          git lfs install --local
          git lfs fetch upstream "$(git rev-parse HEAD)"
          # Berkas LFS yang hanya ada di port (kalau ada) diambil dari fork.
          changed="$(git diff --cached --name-only "HEAD" | paste -sd, -)"
          git lfs fetch origin "$port" --include="$changed" --exclude=""
          git lfs checkout
          missing="$(git lfs ls-files | awk '$2 == "-"')"
          if [ -n "$missing" ]; then
            echo "::error::Aset LFS belum terunduh:"; echo "$missing" | head -20; exit 1
          fi
          {
            echo "### Versi yang dibuild"
            git log -1 --date=iso --pretty='Veloren resmi: `%h` (%cd) %s'
          } >> "$GITHUB_STEP_SUMMARY"

      # Kunci debug yang sama di setiap build, agar APK baru bisa menimpa yang lama.
      - uses: actions/cache@v4
        id: keystore
        with:
          path: .android-home/debug.keystore
          key: voxygen-debug-keystore-v1

      - name: Buat kunci debug (hanya pertama kali)
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$ANDROID_USER_HOME"
          keytool -genkeypair -keystore "$ANDROID_USER_HOME/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: ""
          accept-android-sdk-licenses: false

      - name: Pasang Android SDK, CMake, dan NDK
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" \
            "platform-tools" "cmake;3.22.1" "ndk;28.0.13004108"

      - name: Pasang toolchain Rust sesuai rust-toolchain
        working-directory: src
        shell: bash
        run: |
          toolchain="$(tr -d '\r\n' < rust-toolchain)"
          rustup toolchain install "$toolchain" --profile minimal --target aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          shared-key: android-debug
          cache-on-failure: true

      - name: Pasang cargo-ndk
        working-directory: src
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK debug
        working-directory: src/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: veloren-voxygen-debug
          path: src/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
