# Build APK Android untuk Veloren (native launcher).
# Dipicu otomatis saat GitLab → GitHub mirror menyinkronkan push ke main/master,
# atau dapat dipicu manual melalui Actions tab (workflow_dispatch).
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          ndk: r27b
          api-level: 34
          build-tools: 34.0.0

      - name: Setup Rust + target Android
        uses: dtolnay/rust-toolchain@master
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            android/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Kompilasi library native Rust (cdylib)
        run: |
          cd android
          ANDROID_NDK_HOME="${ANDROID_NDK_ROOT}" ./cargo-build.sh
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK (debug)
        working-directory: android
        run: |
          # Repo belum selalu membawa `gradlew`; buat wrapper lalu pakai itu,
          # atau pakai `gradle` dari gradle/actions/setup-gradle.
          if [ ! -x ./gradlew ]; then
            gradle wrapper
          fi
          ./gradlew assembleDebug

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: veloren-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
