# Build APK Android untuk Veloren (native launcher).
# Dipicu otomatis saat GitLab → GitHub mirror menyinkronkan push ke main/master,
# atau dapat dipicu manual melalui Actions tab (workflow_dispatch).
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4
        with:
          lfs: true   # ambil konten Git LFS asli untuk aset game

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK + NDK
        # ubuntu-latest sudah memasang Android SDK + NDK; pastikan platform & build-tools.
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Rust + target Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            android/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Kompilasi library native Rust (cdylib)
        working-directory: android
        run: ./cargo-build.sh

      - name: Kemas aset game (jika repo punya assets/)
        run: |
          if [ -d "$GITHUB_WORKSPACE/assets" ]; then
            echo "Menemukan assets/ di root repo; menyalin ke APK..."
            "$GITHUB_WORKSPACE/android/prepare-assets.sh" "$GITHUB_WORKSPACE/assets"
          else
            echo "Tidak ada assets/ di repo ini (android-only); melewati pengemasan aset."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK (debug)
        working-directory: android
        run: |
          # Repo belum selalu membawa `gradlew`; buat wrapper lalu pakai itu,
          # atau pakai `gradle` dari gradle/actions/setup-gradle.
          if [ ! -x ./gradlew ]; then
            gradle wrapper
          fi
          ./gradlew assembleDebug

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: veloren-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
